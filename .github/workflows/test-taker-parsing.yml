name: Test OKX taker parsing

on:
  pull_request:
    branches: [codex/deploy]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: taker-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  taker-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tested commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt PyYAML==6.0.2
      - name: Run PR source, safety helpers, taker and collection regressions
        id: preflight
        env:
          ASTRA_CI_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if test -f .github/scripts/decision_release_contract.json; then
            echo 'mode=decision-release' >> "$GITHUB_OUTPUT"
            python .github/scripts/run_decision_release_preflight.py --release-pr
          elif test -f .github/scripts/pr_candidate_contract.json; then
            echo 'mode=candidate' >> "$GITHUB_OUTPUT"
            python .github/scripts/run_deployment_preflight.py --candidate-pr
          elif test -f .github/scripts/collection_release_contract.json; then
            echo 'mode=release' >> "$GITHUB_OUTPUT"
            python .github/scripts/run_deployment_preflight.py --release-pr
          else
            echo 'mode=collection' >> "$GITHUB_OUTPUT"
            python .github/scripts/run_deployment_preflight.py --collection-pr
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend lock without lifecycle scripts
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify frontend gate refusal cases
        run: node .github/scripts/run_collection_frontend.mjs --self-test
      - name: Run 23 focused frontend tests, types and build offline
        run: node .github/scripts/run_collection_frontend.mjs
      - name: Reverify exact PR source after all checks
        env:
          ASTRA_CI_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          ASTRA_PR_MODE: ${{ steps.preflight.outputs.mode }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, '.github/scripts')
          from verify_deployment_source import UPSTREAM_SHA, verify_collection_source, verify_release_source
          # Reuse the original selected gate; contract removal cannot downgrade
          # the final check. Candidate source never receives release eligibility.
          mode = os.environ['ASTRA_PR_MODE']
          if mode == 'decision-release':
              if os.environ.get('GITHUB_EVENT_NAME') != 'pull_request':
                  raise RuntimeError('Release PR verification requires a pull_request event')
              from verify_decision_release_source import verify_decision_release_source
              verify_decision_release_source(Path.cwd(), UPSTREAM_SHA, os.environ['ASTRA_CI_EXPECTED_SHA'])
          elif mode == 'candidate':
              if os.environ.get('GITHUB_EVENT_NAME') != 'pull_request':
                  raise RuntimeError('Candidate verification requires a pull_request event')
              from verify_pr_candidate import CONTRACT_PATH, verify_pr_candidate
              verify_pr_candidate(Path.cwd(), Path.cwd() / CONTRACT_PATH, os.environ['ASTRA_CI_EXPECTED_SHA'])
          elif mode in ('release', 'collection'):
              verifier = verify_release_source if mode == 'release' else verify_collection_source
              verifier(Path.cwd(), UPSTREAM_SHA, os.environ['ASTRA_CI_EXPECTED_SHA'])
          else:
              raise RuntimeError('Missing or invalid original PR verification mode')
          print('PR verification only; no image, production migration or release approval.')
          PY
