name: Test OKX taker parsing

on:
  pull_request:
    branches: [codex/deploy]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: taker-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  taker-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify tested commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify regression gate rejects incomplete results
        run: python -m unittest discover -s .github/scripts -p test_taker_regression_gate.py -v
      - name: Run isolated offline taker regressions
        env:
          ASTRA_CI_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/run_taker_regressions.py
