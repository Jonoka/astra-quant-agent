name: Build AstraQuant release image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/jonoka/astra-quant-agent
  SOURCE_REPOSITORY: Jonoka/astra-quant-agent
  SOURCE_SHA: ${{ github.sha }}
  SOURCE_VERSION: v8.6.1
  UPSTREAM_REPOSITORY: 0xethanq/astra-quant-agent
  UPSTREAM_SHA: e0b29fef1818e0ff9c6b210eb73234620e276a02
  PREVIOUS_SHA: 90f9f3a558bdbea0171b19a42c58e2fae7ed8e9d

concurrency:
  group: astra-release-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Fork CI helpers
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Checkout corrected fork source at exact workflow commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          path: source

      - name: Verify official release ancestry and retained application repair
        shell: bash
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in refs/heads/codex/deploy|refs/heads/codex/okx-public-domains) ;; *) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch "https://github.com/$UPSTREAM_REPOSITORY.git" "refs/tags/$SOURCE_VERSION:refs/tags/$SOURCE_VERSION"
          git merge-base --is-ancestor "$SOURCE_VERSION^{commit}" "$UPSTREAM_SHA"
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
          gh api "repos/$UPSTREAM_REPOSITORY/releases/tags/$SOURCE_VERSION" | python -c '
          import json, os, sys
          release = json.load(sys.stdin)
          assert release["tag_name"] == os.environ["SOURCE_VERSION"]
          assert not release["draft"] and not release["prerelease"]
          '
          python ../ci/.github/scripts/verify_deployment_source.py . "$UPSTREAM_SHA" "$SOURCE_SHA"

      - name: Checkout deployed fork for same-release compatibility fixtures
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.PREVIOUS_SHA }}
          fetch-depth: 1
          path: previous

      - name: Set up hosted migration test runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install hosted test dependencies
        run: python -m pip install -r source/requirements.txt PyYAML==6.0.2

      - name: Verify prior source pin
        run: test "$(git -C previous rev-parse HEAD)" = "$PREVIOUS_SHA"

      - name: Isolate writable test fixtures from the build source
        shell: bash
        run: |
          git -C source worktree add --detach "$GITHUB_WORKSPACE/validation" "$SOURCE_SHA"
          test "$(git -C validation rev-parse HEAD)" = "$SOURCE_SHA"
          python ci/.github/scripts/verify_deployment_source.py validation "$UPSTREAM_SHA" "$SOURCE_SHA"

      - name: Run official migration and administrator tests
        working-directory: validation
        shell: bash
        run: |
          for target in .github/scripts/test_verify_deployment_source.py tests/ops/test_brain_dispatch.py tests/extraction/test_brain_dispatch_extraction.py tests/trading/test_cycle_brain_stage.py tests/core/test_council_manager.py tests/core/test_debate_council_verdict.py tests/core/test_account_baseline.py tests/core/test_router_risk.py tests/ops/test_gateway_cache_stats.py tests/trading/test_entry_diagnostics_formatting.py tests/ops/test_migrate_r20_to_astra.py tests/core/test_admin_auth.py tests/llm/test_prompt_library_two_files.py tests/llm/test_prompt_source_of_truth.py tests/trading/test_signal_decision_doctrine.py tests/trading/test_signal_subfactors.py tests/trading/test_position_exit_failure_branches.py tests/llm/test_prompt_cache_prefix_contract.py tests/llm/test_llm_caching_enhancements.py tests/core/test_risk_config.py tests/trading/test_risk_reward_structure.py tests/ops/test_instrument_pool.py tests/venues/test_instrument_pool_universe.py tests/venues/test_okx_public_data.py tests/venues/test_okx_rest.py tests/venues/test_market_data_service.py tests/venues/test_market_data_service_tails.py tests/venues/test_exchange_diagnostics_tails.py tests/venues/test_okx_public_domains.py tests/core/test_okx_client.py tests/core/test_exchange_listing_directory.py tests/core/test_listing_gate.py tests/core/test_exchange_listing_snapshot.py tests/core/test_exchange_listing_check.py tests/core/test_news_sentiment_harvester.py tests/ops/test_brain_packages.py tests/ops/test_factor_library.py tests/ops/test_factors_smart_money.py tests/trading/test_okx_quant_factors.py tests/trading/test_factor_assembly_paths.py; do
            python - "$target" <<'PY'
          from pathlib import Path
          import sys
          import unittest
          target = Path(sys.argv[1])
          assert target.is_file(), f"Required suite missing: {target}"
          suite = unittest.defaultTestLoader.discover(str(target.parent), pattern=target.name)
          assert suite.countTestCases() > 0, f"No tests discovered: {target}"
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun > len(result.skipped), f"Suite failed or only skipped: {target}"
          PY
          done

      - name: Rehearse encrypted legacy state and environment migration
        run: python ci/.github/scripts/rehearse_release_migration.py validation

      - name: Rehearse deployed fork state and custom prompt preservation
        run: python ci/.github/scripts/rehearse_release_upgrade.py validation previous

      - name: Require all cycle deadline regressions
        working-directory: validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import unittest
          targets = (
              ('tests/core/test_council_deadline.py', 6),
              ('tests/llm/test_llm_deadline.py', 18),
              ('tests/ops/test_brain_deadline.py', 20),
              ('tests/ops/test_cycle_deadline.py', 24),
              ('tests/ops/test_file_lock_deadline.py', 7),
              ('tests/ops/test_brain_atomic_deadline.py', 4),
              ('tests/core/test_council_debate_mode.py', 1),
              ('tests/llm/test_council_manager.py', 1),
              ('tests/llm/test_llm_call_tails.py', 1),
              ('tests/llm/test_llm_transport_tails.py', 1),
              ('tests/llm/test_llm_resilience.py', 1),
          )
          for name, minimum in targets:
              target = Path(name)
              assert target.is_file(), f'Required suite missing: {target}'
              suite = unittest.defaultTestLoader.discover(str(target.parent), pattern=target.name)
              assert suite.countTestCases() >= minimum, f'Incomplete discovery: {target}'
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              assert result.wasSuccessful() and result.testsRun >= minimum and result.testsRun > len(result.skipped), f'Suite failed or incomplete: {target}'
              if minimum > 1:
                  assert not result.skipped, f'Required deadline regression skipped: {target}'
          PY

      - name: Verify Linux real singleton locks
        working-directory: validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import unittest
          assert sys.platform.startswith('linux'), 'Real Linux locks required'
          target = Path('.github/scripts/test_linux_singleton_lock.py')
          assert target.is_file(), 'Linux singleton suite missing'
          suite = unittest.defaultTestLoader.discover(str(target.parent), pattern=target.name)
          assert suite.countTestCases() >= 7, 'Incomplete Linux singleton discovery'
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun >= 7 and not result.skipped, 'Linux singleton suite failed, incomplete or skipped'
          PY

      - name: Rehearse cycle deadline upgrade and latest-state rollback
        run: python ci/.github/scripts/rehearse_cycle_deadline_upgrade.py --source validation --previous previous

      - name: Require real cycle deadline state rehearsal tests
        env:
          ASTRA_PREVIOUS_SOURCE: ${{ github.workspace }}/previous
        run: |
          python - <<'PY'
          from pathlib import Path
          import unittest
          target = Path('ci/.github/scripts/test_rehearse_cycle_deadline_upgrade.py')
          assert target.is_file(), 'Cycle deadline state rehearsal suite missing'
          suite = unittest.defaultTestLoader.discover(str(target.parent), pattern=target.name)
          assert suite.countTestCases() >= 4, 'Incomplete cycle deadline state rehearsal discovery'
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun >= 4 and not result.skipped, 'Cycle deadline state rehearsal failed, incomplete or skipped'
          PY

      - name: Verify runtime upgrade helper
        run: |
          python - <<'PY'
          from pathlib import Path
          import unittest
          target = Path("ci/.github/scripts/test_runtime_release_upgrade.py")
          assert target.is_file(), f"Required suite missing: {target}"
          suite = unittest.defaultTestLoader.discover(str(target.parent), pattern=target.name)
          assert suite.countTestCases() > 0, f"No tests discovered: {target}"
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun > len(result.skipped), "Helper suite failed or only skipped"
          PY

      - name: Require clean corrected fork application before building
        shell: bash
        run: |
          git -C validation diff --exit-code HEAD
          git -C validation status --porcelain
          git -C source diff --exit-code HEAD
          git -C source status --porcelain
          test -z "$(git -C source status --porcelain)"
          python ci/.github/scripts/verify_deployment_source.py source "$UPSTREAM_SHA" "$SOURCE_SHA"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive pinned release recipe with official landing asset
        id: recipe
        run: python ci/.github/scripts/prepare_release_dockerfile.py source ci/Dockerfile.release >> "$GITHUB_OUTPUT"

      - name: Build candidate from corrected fork and reviewed release recipe
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./ci/Dockerfile.release
          platforms: linux/amd64
          load: true
          push: false
          tags: astraquant:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.SOURCE_REPOSITORY }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.SOURCE_VERSION }}
            io.jonoka.astra.upstream-revision=${{ env.UPSTREAM_SHA }}
            io.jonoka.astra.council-completion-patch=council-completion-v1
            io.jonoka.astra.okx-public-domains-patch=okx-public-domains-v1
            io.jonoka.astra.cycle-deadline-patch=cycle-deadline-v1
            io.jonoka.astra.build-recipe-sha256=${{ steps.recipe.outputs.sha256 }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=astra-release
          cache-to: type=gha,scope=astra-release,mode=max

      - name: Verify candidate image real singleton locks
        id: candidate_lock
        shell: bash
        run: |
          candidate_id="$(docker image inspect --format '{{.Id}}' astraquant:ci)"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=16m \
            --mount "type=bind,source=$GITHUB_WORKSPACE/ci/.github/scripts/test_linux_singleton_lock.py,target=/acceptance/test_linux_singleton_lock.py,readonly" \
            -e ASTRA_LOCK_TEST_SOURCE_ROOT=/app --entrypoint python "$candidate_id" /acceptance/test_linux_singleton_lock.py
          printf 'image_id=%s\n' "$candidate_id" >> "$GITHUB_OUTPUT"

      - name: Smoke test official Compose services and auth
        id: candidate
        env:
          BUILD_RECIPE_SHA256: ${{ steps.recipe.outputs.sha256 }}
          EXPECTED_IMAGE_ID: ${{ steps.candidate_lock.outputs.image_id }}
        run: |
          python ci/.github/scripts/smoke_release_compose.py source astraquant:ci previous
          printf 'image_id=%s\n' "$(docker image inspect --format '{{.Id}}' astraquant:ci)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the smoke-tested linux/amd64 image
        id: publish
        shell: bash
        run: |
          patched_tag="$SOURCE_VERSION-cycle-deadline-fix-${SOURCE_SHA:0:12}"
          docker tag astraquant:ci "$IMAGE_NAME:$patched_tag"
          docker tag astraquant:ci "$IMAGE_NAME:$SOURCE_SHA"
          docker push "$IMAGE_NAME:$patched_tag"
          docker push "$IMAGE_NAME:$SOURCE_SHA"
          digest="sha256:$(docker buildx imagetools inspect "$IMAGE_NAME:$SOURCE_SHA" --raw | sha256sum | cut -d' ' -f1)"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Verify published immutable image
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          EXPECTED_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
          BUILD_RECIPE_SHA256: ${{ steps.recipe.outputs.sha256 }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE_NAME@$IMAGE_DIGEST"
          python ci/.github/scripts/smoke_release_compose.py source "$IMAGE_NAME@$IMAGE_DIGEST" previous
          docker buildx imagetools inspect "$IMAGE_NAME@$IMAGE_DIGEST"
          printf '### Verified corrected release image\n\n- Source: `%s@%s`\n- Version: `%s`\n- Image: `%s@%s`\n- Platform: `linux/amd64`\n- Required council completion and all 62 cycle deadline regressions, patch retention, Linux real singleton locks, positive test discovery, cycle schema/latest-state rollback rehearsal, official migration, encrypted state, prior admin/session, custom baseline/overlay rendering and both Compose healthchecks passed.\n- Published image ID equals the smoke-tested candidate.\n' \
            "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$SOURCE_VERSION" "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Package raw pinned source and reviewed deployment provenance
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          BUILD_RECIPE_SHA256: ${{ steps.recipe.outputs.sha256 }}
        shell: bash
        run: |
          mkdir release-artifacts
          git -C source archive --format=tar "$SOURCE_SHA" > release-artifacts/source-release.tar
          git -C previous archive --format=tar "$PREVIOUS_SHA" > release-artifacts/source-previous.tar
          cp ci/.github/scripts/runtime_release_upgrade.py release-artifacts/
          cp ci/.github/scripts/stage_release_bundle.py release-artifacts/
          cp ci/Dockerfile.release release-artifacts/
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('release-artifacts')
          evidence = {key: os.environ[key] for key in ('SOURCE_REPOSITORY', 'SOURCE_SHA', 'UPSTREAM_REPOSITORY', 'UPSTREAM_SHA', 'PREVIOUS_SHA', 'SOURCE_VERSION', 'IMAGE_NAME', 'IMAGE_DIGEST', 'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'BUILD_RECIPE_SHA256')}
          evidence['platform'] = 'linux/amd64'
          evidence['sha256'] = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir())}
          (root / 'provenance.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY

      - name: Upload verified raw deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: astraquant-v8.6.1-cycle-deadline-deployment
          path: release-artifacts/
          if-no-files-found: error
