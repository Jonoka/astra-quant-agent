name: Test OKX taker parsing

on:
  pull_request:
    branches: [codex/deploy]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: taker-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  taker-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tested commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt PyYAML==6.0.2
      - name: Run PR source, safety helpers, taker and collection regressions
        env:
          ASTRA_CI_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/run_deployment_preflight.py --collection-pr
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend lock without lifecycle scripts
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify frontend gate refusal cases
        run: node .github/scripts/run_collection_frontend.mjs --self-test
      - name: Run 23 focused frontend tests, types and build offline
        run: node .github/scripts/run_collection_frontend.mjs
      - name: Reverify exact PR source after all checks
        env:
          ASTRA_CI_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, '.github/scripts')
          from verify_deployment_source import UPSTREAM_SHA, verify_collection_source
          verify_collection_source(Path.cwd(), UPSTREAM_SHA, os.environ['ASTRA_CI_EXPECTED_SHA'])
          print('PR verification only; no image, production migration or release approval.')
          PY
